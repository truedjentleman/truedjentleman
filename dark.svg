<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none"
xmlns="http://www.w3.org/2000/svg"
font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="48%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>
  <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>
  <radialGradient id="glow1">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow3">
    <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#334155" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="38"/>
  </filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="1180" height="610" rx="28"/></clipPath>
  <clipPath id="leftClip"><rect x="40" y="70" width="380" height="470" rx="18"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1180" height="610" fill="#030712"/>
  <rect width="1180" height="610" fill="url(#grid)"/>

  <g filter="url(#blur)">
    <circle cx="160" cy="150" r="160" fill="url(#glow1)">
      <animate attributeName="cx" values="160;260;160" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;430;150" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="160" r="190" fill="url(#glow2)">
      <animate attributeName="cx" values="930;760;930" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;450;160" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="560" r="150" fill="url(#glow3)">
      <animate attributeName="cx" values="650;790;650" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="40" y="70" width="380" height="470" rx="18"
