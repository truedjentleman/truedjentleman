    <rect x="40" y="70" width="380" height="46" rx="18"
          fill="#111827" fill-opacity="0.96"/>
    <circle cx="66" cy="93" r="5" fill="#EF4444"/>
    <circle cx="86" cy="93" r="5" fill="#EAB308"/>
    <circle cx="106" cy="93" r="5" fill="#22C55E"/>
    <text x="230" y="98" text-anchor="middle" fill="#94A3B8" font-size="12" letter-spacing="1">~/infrastructure.map</text>

    <g clip-path="url(#leftClip)">
      <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.85">
        <path d="M230 160 L135 225 L175 320 L230 405"/>
        <path d="M230 160 L325 225 L285 320 L230 405"/>
        <path d="M135 225 L230 260 L325 225"/>
        <path d="M135 225 L285 320"/>
        <path d="M325 225 L175 320"/>
        <path d="M175 320 L285 320"/>
        <path d="M230 260 L230 405"/>
        <path d="M175 320 L105 390"/>
        <path d="M285 320 L355 390"/>
        <path d="M105 390 L230 455 L355 390"/>
      </g>

      <circle r="4" fill="#22D3EE" filter="url(#softGlow)">
        <animateMotion dur="5.2s" repeatCount="indefinite" path="M230 160 L135 225 L175 320 L230 405 L355 390"/>
      </circle>
      <circle r="3.5" fill="#7C3AED" filter="url(#softGlow)">
        <animateMotion dur="6.4s" begin="1.1s" repeatCount="indefinite" path="M105 390 L175 320 L230 260 L325 225 L230 160"/>
      </circle>
      <circle r="3.5" fill="#10B981" filter="url(#softGlow)">
        <animateMotion dur="5.8s" begin="2.2s" repeatCount="indefinite" path="M355 390 L285 320 L135 225 L230 160"/>
      </circle>

      <g fill="#0F172A" stroke-width="2">
        <g stroke="#22D3EE">
          <circle cx="230" cy="160" r="13"/>
          <circle cx="230" cy="260" r="11"/>
          <circle cx="230" cy="405" r="13"/>
        </g>
        <g stroke="#7C3AED">
          <circle cx="135" cy="225" r="11"/>
          <circle cx="325" cy="225" r="11"/>
        </g>
        <g stroke="#10B981">
          <circle cx="175" cy="320" r="11"/>
          <circle cx="285" cy="320" r="11"/>
          <circle cx="105" cy="390" r="9"/>
          <circle cx="355" cy="390" r="9"/>
        </g>
      </g>

      <g fill="#F8FAFC" font-size="10" text-anchor="middle">
        <text x="230" y="164">CLOUD</text>
        <text x="135" y="229">EDGE</text>
        <text x="325" y="229">EDGE</text>
        <text x="230" y="264">CORE</text>
        <text x="175" y="324">DC</text>
        <text x="285" y="324">DC</text>
        <text x="230" y="409">SERVICES</text>
      </g>

      <text x="70" y="485" fill="#94A3B8" font-size="11" letter-spacing="1.2">SYSTEM STATUS</text>
      <circle cx="74" cy="507" r="4" fill="#10B981">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="88" y="511" fill="#F8FAFC" font-size="11">connected · observable · scalable</text>
    </g>
  </g>

  <g>
