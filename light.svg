<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none"
xmlns="http://www.w3.org/2000/svg"
font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="48%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>
  <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>
  <radialGradient id="glow1">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow3">
    <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#CBD5E1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="38"/>
  </filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="1180" height="610" rx="28"/></clipPath>
  <clipPath id="leftClip"><rect x="40" y="70" width="380" height="470" rx="18"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1180" height="610" fill="#F8FAFC"/>
  <rect width="1180" height="610" fill="url(#grid)"/>

  <g filter="url(#blur)">
    <circle cx="160" cy="150" r="160" fill="url(#glow1)">
      <animate attributeName="cx" values="160;260;160" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;430;150" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="160" r="190" fill="url(#glow2)">
      <animate attributeName="cx" values="930;760;930" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;450;160" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="560" r="150" fill="url(#glow3)">
      <animate attributeName="cx" values="650;790;650" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="40" y="70" width="380" height="470" rx="18"
          fill="#FFFFFF" fill-opacity="0.88" stroke="#0F172A" stroke-opacity="0.18"/>
    <rect x="40" y="70" width="380" height="46" rx="18"
          fill="#F1F5F9" fill-opacity="0.96"/>
    <circle cx="66" cy="93" r="5" fill="#EF4444"/>
    <circle cx="86" cy="93" r="5" fill="#EAB308"/>
    <circle cx="106" cy="93" r="5" fill="#22C55E"/>
    <text x="230" y="98" text-anchor="middle" fill="#64748B" font-size="12" letter-spacing="1">~/infrastructure.map</text>

    <g clip-path="url(#leftClip)">
      <!-- Structured infrastructure topology -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- primary paths -->
        <path d="M230 150 L135 210" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M230 150 L325 210" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M135 210 L230 260" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M325 210 L230 260" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>

        <path d="M230 260 L160 325" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M230 260 L300 325" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M135 210 L160 325" stroke="#CBD5E1" stroke-width="1.25" stroke-opacity="0.78"/>
        <path d="M325 210 L300 325" stroke="#CBD5E1" stroke-width="1.25" stroke-opacity="0.78"/>

        <path d="M160 325 L115 400" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M160 325 L230 400" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M300 325 L230 400" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>
        <path d="M300 325 L345 400" stroke="#94A3B8" stroke-width="1.7" stroke-opacity="0.90"/>

        <!-- peer / redundancy links -->
        <path d="M135 210 L325 210" stroke="#CBD5E1" stroke-width="1.15" stroke-opacity="0.55" stroke-dasharray="5 5"/>
        <path d="M160 325 L300 325" stroke="#CBD5E1" stroke-width="1.15" stroke-opacity="0.55" stroke-dasharray="5 5"/>
        <path d="M115 400 L230 400" stroke="#CBD5E1" stroke-width="1.15" stroke-opacity="0.62"/>
        <path d="M230 400 L345 400" stroke="#CBD5E1" stroke-width="1.15" stroke-opacity="0.62"/>
      </g>

      <!-- animated traffic follows real links only -->
      <circle r="4" fill="#22D3EE" filter="url(#softGlow)">
        <animateMotion dur="5.4s" repeatCount="indefinite"
          path="M230 150 L135 210 L230 260 L300 325 L230 400"/>
      </circle>
      <circle r="3.7" fill="#7C3AED" filter="url(#softGlow)">
        <animateMotion dur="6.1s" begin="1.4s" repeatCount="indefinite"
          path="M230 150 L325 210 L230 260 L160 325 L115 400"/>
      </circle>
      <circle r="3.7" fill="#10B981" filter="url(#softGlow)">
        <animateMotion dur="5.8s" begin="2.6s" repeatCount="indefinite"
          path="M115 400 L160 325 L300 325 L345 400"/>
      </circle>

      <!-- node halos -->
      <g fill="none" stroke-width="1">
        <circle cx="230" cy="150" r="15" stroke="#22D3EE" stroke-opacity="0.18"/>
        <circle cx="135" cy="210" r="13" stroke="#7C3AED" stroke-opacity="0.18"/>
        <circle cx="325" cy="210" r="13" stroke="#7C3AED" stroke-opacity="0.18"/>
        <circle cx="230" cy="260" r="14" stroke="#22D3EE" stroke-opacity="0.18"/>
        <circle cx="160" cy="325" r="13" stroke="#10B981" stroke-opacity="0.18"/>
        <circle cx="300" cy="325" r="13" stroke="#10B981" stroke-opacity="0.18"/>
        <circle cx="115" cy="400" r="12" stroke="#22D3EE" stroke-opacity="0.16"/>
        <circle cx="230" cy="400" r="13" stroke="#10B981" stroke-opacity="0.18"/>
        <circle cx="345" cy="400" r="12" stroke="#22D3EE" stroke-opacity="0.16"/>
      </g>

      <!-- nodes -->
      <g fill="#FFFFFF" stroke-width="2.1">
        <circle cx="230" cy="150" r="8" stroke="#22D3EE"/>
        <circle cx="135" cy="210" r="7.5" stroke="#7C3AED"/>
        <circle cx="325" cy="210" r="7.5" stroke="#7C3AED"/>
        <circle cx="230" cy="260" r="8" stroke="#22D3EE"/>
        <circle cx="160" cy="325" r="7.5" stroke="#10B981"/>
        <circle cx="300" cy="325" r="7.5" stroke="#10B981"/>
        <circle cx="115" cy="400" r="7" stroke="#22D3EE"/>
        <circle cx="230" cy="400" r="7.5" stroke="#10B981"/>
        <circle cx="345" cy="400" r="7" stroke="#22D3EE"/>
      </g>

      <!-- subtle active-node pulse -->
      <circle cx="230" cy="260" r="11" fill="none" stroke="#22D3EE" stroke-width="1">
        <animate attributeName="r" values="10;16;10" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="2.8s" repeatCount="indefinite"/>
      </circle>

      <!-- labels sit outside nodes so links stay readable -->
      <g fill="#0F172A" font-size="9.2" text-anchor="middle" letter-spacing="0.65">
        <text x="230" y="131">CLOUD</text>
        <text x="135" y="232">EDGE-W</text>
        <text x="325" y="232">EDGE-E</text>
        <text x="230" y="283">CORE</text>
        <text x="160" y="348">DC-A</text>
        <text x="300" y="348">DC-B</text>
        <text x="115" y="423">API</text>
        <text x="230" y="423">SERVICES</text>
        <text x="345" y="423">APPS</text>
      </g>

      <text x="70" y="485" fill="#64748B" font-size="11" letter-spacing="1.2">SYSTEM STATUS</text>
      <circle cx="74" cy="507" r="4" fill="#10B981">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="88" y="511" fill="#0F172A" font-size="11">connected · observable · scalable</text>
    </g>
  </g>

  <g>
    <rect x="455" y="70" width="687" height="470" rx="18"
          fill="#FFFFFF" fill-opacity="0.90" stroke="#0F172A" stroke-opacity="0.18"/>
    <rect x="455" y="70" width="687" height="46" rx="18"
          fill="#F1F5F9" fill-opacity="0.96"/>
    <circle cx="481" cy="93" r="5" fill="#EF4444"/>
    <circle cx="501" cy="93" r="5" fill="#EAB308"/>
    <circle cx="521" cy="93" r="5" fill="#22C55E"/>
    <text x="800" y="98" text-anchor="middle" fill="#64748B" font-size="12" letter-spacing="1">andrew — zsh</text>

    <text x="490" y="160" fill="#0F172A" font-size="27" font-weight="700">
      Hi 👋 I'm <tspan fill="url(#accent)">Andrew Burlutski</tspan>
    </text>

    <text x="490" y="198" fill="#64748B" font-size="16">$ focus:</text>

    <g font-size="16.5" font-weight="600">
      <text x="565" y="198" fill="#22D3EE">
        Network Infrastructure
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.25;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="565" y="198" fill="#7C3AED" opacity="0">
        Telecom &amp; Connectivity
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.47;0.50;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="565" y="198" fill="#10B981" opacity="0">
        Infrastructure Automation
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.50;0.72;0.75;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="565" y="198" fill="#22D3EE" opacity="0">
        Systems Engineering
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" dur="15s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="553" y="184" width="7" height="17" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <g font-size="14">
      <text x="490" y="242" fill="#7C3AED">📍 Location<tspan x="610" fill="#0F172A">Poland</tspan></text>
      <text x="490" y="270" fill="#22D3EE">⚡ Engineering<tspan x="610" fill="#0F172A">Infrastructure · Connectivity · Automation</tspan></text>
      <text x="490" y="298" fill="#10B981">◈ Interests<tspan x="610" fill="#0F172A">Cloud · Data Centers · Distributed Systems</tspan></text>
    </g>

    <text x="490" y="344" fill="#64748B" font-size="11" letter-spacing="2">SKILLS</text>

    <g font-size="12" text-anchor="middle" fill="#0F172A">
      <g><rect x="490" y="358" width="92" height="28" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.48"/><text x="536" y="376">Networking</text></g>
      <g><rect x="590" y="358" width="78" height="28" rx="14" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-opacity="0.48"/><text x="629" y="376">Telecom</text></g>
      <g><rect x="676" y="358" width="72" height="28" rx="14" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.48"/><text x="712" y="376">Cloud</text></g>
      <g><rect x="756" y="358" width="96" height="28" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.48"/><text x="804" y="376">Automation</text></g>

      <g><rect x="490" y="396" width="68" height="28" rx="14" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.48"/><text x="524" y="414">Linux</text></g>
      <g><rect x="566" y="396" width="76" height="28" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.48"/><text x="604" y="414">Python</text></g>
      <g><rect x="650" y="396" width="58" height="28" rx="14" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-opacity="0.48"/><text x="679" y="414">APIs</text></g>
      <g><rect x="716" y="396" width="136" height="28" rx="14" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.48"/><text x="784" y="414">Systems Design</text></g>
    </g>

    <line x1="490" y1="454" x2="1105" y2="454" stroke="#CBD5E1" stroke-opacity="0.55"/>

    <text x="490" y="493" fill="#64748B" font-size="12">$ mantra</text>
    <text x="565" y="493" fill="url(#accent2)" font-size="18" font-weight="700">Designing systems that keep data moving.</text>
    <text x="490" y="520" fill="#64748B" font-size="11">reliable · observable · scalable · automated</text>
  </g>

  <rect x="1" y="1" width="1178" height="608" rx="28"
        fill="none" stroke="url(#accent)" stroke-width="1.4" stroke-opacity="0.60"/>
</g>
</svg>